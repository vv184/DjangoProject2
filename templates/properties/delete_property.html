<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление объявления</title>
</head>
<body>

<h1>Удаление объявления</h1>

<p>
    Вы действительно хотите удалить объявление
    <strong>{{ property.title }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Да, удалить</button>
</form>

<p>
    <a href="{% url 'property_list' %}">Отмена</a>
</p>

</body>
</html>
